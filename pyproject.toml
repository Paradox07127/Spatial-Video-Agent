[project]
name = "spatial-video-agent"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
  "duckdb==1.5.6",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "numpy==2.5.3",
  "shapely==2.2.0",
  "pyproj==3.8.0",
  "rapidfuzz==3.14.6",
  "opencv-python-headless==4.14.0.94",
  "pillow==12.3.0",
  "weave==0.53.11",
  "pyarrow==23.0.1",
  "boto3==1.43.110",
  "vastdb==2.1.0",
  "supervision==0.30.9",
  "pyDeprecate==0.13.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
