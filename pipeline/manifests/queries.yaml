# 20 scripted retrieval queries for eval/retrieval_recall.py (spec §10.4, §13.3, §17.3).
#
# Each query: q (text sent to every retriever), scope (scene_key prefix; the same hard filter applies to every column),
# source (gt = dataset ground-truth labels; rule = a rule evaluated on ground-truth positions or sensors, 6 of 20),
# annotation (how the intervals were derived), expected ([scene_key, t0_ms, t1_ms) intervals, camera-agnostic).
# The intervals come from the raw data, not from our events.json: SDG runs from metro_agent_data in
# raw/sdg_warehouse/runs/<run>/<cam>.object_detection.jsonl (30 fps, agents merged across the 3 cams); PIE from
# data/gt/pie_cam-3/<video>.jsonl and <video>_ego.jsonl (PIE annotates only frame ranges around tracked pedestrians, so
# object queries have no positives in unannotated frames). True frames are merged across gaps <= 0.5 s; runs shorter
# than 0.3 s (1 s for "parked" and "standing still", 2 s for "car stopped") are dropped.
# Scoring: a result maps to the 5 s moment (scene_key, t0_ms // 5000); results from several cameras at the same moment
# count once. relevant = moments that an expected interval intersects;
# Recall@5 = |relevant ∩ top-5 moments| / min(5, |relevant|).
