[project]
name = "sva-pipeline"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "ultralytics>=8.3,<8.4",
  "rtmlib>=0.0.13",
  "onnxruntime-gpu>=1.20",
  "opencv-python-headless>=4.12,<5",
  "numpy>=2.1",
  "scipy>=1.14",
  "duckdb==1.5.6",
  "pyarrow>=18,<=23.0.1",
  "shapely>=2.0",
  "rapidfuzz>=3.10",
  "pyproj>=3.7",
  "osmium==4.3.1",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "jsonschema==4.26.0",
  "httpx>=0.27",
  "pillow>=11",
  "vastdb>=2.0",
  "weave>=0.52",
  "lap>=0.5.13",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
